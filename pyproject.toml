[project]
name = "homeassistant-glowbright"
version = "0.1.0"
description = "Delayed Bright DCC interval imports for Home Assistant"
requires-python = ">=3.14"
license = "MIT"

[project.optional-dependencies]
test = ["pytest-homeassistant-custom-component==0.13.364", "home-assistant-frontend==20260826.6", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
