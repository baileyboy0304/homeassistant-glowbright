name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install pytest-homeassistant-custom-component==0.13.364 home-assistant-frontend==20260826.6 ruff
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: pytest
      - run: node --test tests/frontend.test.mjs
